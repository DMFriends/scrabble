name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to put in the package name
        required: true
        default: "1.0"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            package_type: deb
          - label: macOS
            os: macos-latest
            package_type: dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build package
        shell: bash
        env:
          APP_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: bash scripts/package-unix.sh

      - name: Save package artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrabble-${{ matrix.package_type }}
          path: release/*

      - name: Attach package to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/* --clobber
